services:
  open-seo:
    image: ${OPEN_SEO_IMAGE:-ghcr.io/every-app/open-seo:latest}
    restart: unless-stopped
    # Forward EVERY .env value into the container. The explicit `environment:`
    # list below still wins for the values it names — without this, any .env
    # value not listed there (e.g. OPENROUTER_API_KEY) silently never reached
    # the app. Compose errors if .env is missing; the quickstart's
    # `cp .env.example .env` creates it.
    env_file:
      - .env
    # Anonymous usage heartbeat controls: docs/SELF_HOSTING_DOCKER.md#telemetry
    environment:
      # Required for local Docker self-hosting: exposes Compose env vars to cloudflare:workers bindings.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=${PORT:-3001}
      - ALLOWED_HOST=${ALLOWED_HOST:-}
      - AUTH_MODE=local_noauth
      - OPENSEO_TELEMETRY_DISABLED=${OPENSEO_TELEMETRY_DISABLED:-}
      - DO_NOT_TRACK=${DO_NOT_TRACK:-}
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
      # Optional: AI features (SAM, the in-app SEO agent). Keys are forwarded
      # from .env (OPENROUTER_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY,
      # ANTHROPIC_API_KEY). AI_AGENT_PROVIDER picks the default provider when
      # no per-project/org settings row exists (default openrouter).
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OPENAI_COMPATIBLE_API_KEY=${OPENAI_COMPATIBLE_API_KEY:-}
      - AI_AGENT_PROVIDER=${AI_AGENT_PROVIDER:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - OLLAMA_CLOUD_MODEL=${OLLAMA_CLOUD_MODEL:-}
      - OPENAI_COMPATIBLE_MODEL=${OPENAI_COMPATIBLE_MODEL:-}
      - OPENAI_COMPATIBLE_BASE_URL=${OPENAI_COMPATIBLE_BASE_URL:-}
      - OLLAMA_CLOUD_BASE_URL=${OLLAMA_CLOUD_BASE_URL:-}
      - AI_AGENT_MODEL=${AI_AGENT_MODEL:-}
      - AI_AGENT_MAX_TOOL_CALLS=${AI_AGENT_MAX_TOOL_CALLS:-}
      - AI_AGENT_MAX_STEPS=${AI_AGENT_MAX_STEPS:-}
      - AI_AGENT_POLL_INITIAL_MS=${AI_AGENT_POLL_INITIAL_MS:-}
      - AI_AGENT_POLL_MAX_MS=${AI_AGENT_POLL_MAX_MS:-}
      - AI_AGENT_MAX_POLL_ATTEMPTS=${AI_AGENT_MAX_POLL_ATTEMPTS:-}
      - AI_AGENT_TOOL_TIMEOUT_MS=${AI_AGENT_TOOL_TIMEOUT_MS:-}
      # Optional: Google Search Console. See
      # docs/SELF_HOSTING_GOOGLE_SEARCH_CONSOLE.md
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - VITE_SHOW_DEVTOOLS=false
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    volumes:
      - open_seo_data:/app/.wrangler
volumes:
  open_seo_data:
