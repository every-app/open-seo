name: Agent instructions

on:
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/sync-agent-instructions.py
      - .github/workflows/agent-instructions.yml
  push:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/sync-agent-instructions.py
      - .github/workflows/agent-instructions.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: python3 .github/sync-agent-instructions.py
