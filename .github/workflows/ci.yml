name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm run ci:check

      - name: Run tests
        run: pnpm run test:ci

      # Runs the leanWorkerBundle generateBundle assertion: fails if a
      # denylisted package (dataforseo-client, autumn-js, ...) re-enters the
      # worker's eager startup graph. See vite-plugin-lean-worker-bundle.ts.
      - name: Build worker (eager-bundle guard)
        run: pnpm vite build

      # The standalone Docker edition: one server module for celld. Keeps the
      # single-module build and the crawl gateway honest without Docker.
      - name: Build standalone server
        run: pnpm build:standalone

      - name: Test standalone crawl gateway
        run: pnpm test:standalone:gateway

      - name: Install website dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Test free-tool abuse and spend protection
        run: pnpm --dir web run test:protection

      - name: Run website type checks
        run: pnpm --dir web run types:check

      - name: Build website
        run: pnpm --dir web run build

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build self-host Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  standalone-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build standalone Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/standalone/Dockerfile
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha,scope=standalone
          cache-to: type=gha,mode=max,scope=standalone
